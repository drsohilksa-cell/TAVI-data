<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5cab">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>TAVI Research Data Entry</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#17202a;--mu:#5d6b7a;--bd:#d5dce4;--pr:#0b5cab;--prt:#fff;--dg:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10151b;--card:#1a222b;--tx:#e8edf2;--mu:#98a6b5;--bd:#2d3945;--pr:#4a9be8;--prt:#08121c;--dg:#ff7b6b}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{background:var(--pr);color:var(--prt);padding:14px 16px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0}header small{opacity:.85}
nav{display:flex;gap:6px;padding:10px 12px;position:sticky;top:58px;background:var(--bg);z-index:4}
nav button{flex:1}
main{padding:0 12px 80px;max-width:760px;margin:auto}
section{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
section h2{font-size:15px;margin:0 0 8px;color:var(--pr)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:12px;color:var(--mu)}
input,select,textarea{width:100%;font:inherit;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);margin-top:2px}
button{font:inherit;padding:10px 14px;border:1px solid var(--pr);border-radius:8px;background:transparent;color:var(--pr);cursor:pointer}
button.p{background:var(--pr);color:var(--prt)}button.d{border-color:var(--dg);color:var(--dg)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.rec{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.rec:last-child{border:0}.mu{color:var(--mu);font-size:13px}
.hide{display:none}.ro{opacity:.75}
textarea{height:140px;font:12px monospace}
</style></head><body>
<header><h1>TAVI Research Data Entry</h1><small>Use anonymised study IDs only, never names</small></header>
<nav><button class="p" id="tF">Entry</button><button id="tL">Records (<span id="n">0</span>)</button></nav>
<main>
<div id="vF"><div id="form"></div>
<div class="bar"><button class="p" id="save">Save record</button><button id="clr">New / clear</button></div></div>
<div id="vL" class="hide">
<div class="bar"><button class="p" id="csv">Export CSV</button><button id="cp">Copy CSV</button><button class="d" id="del">Delete all</button></div>
<textarea id="out" class="hide" readonly></textarea>
<section id="list"></section></div>
</main>
<script>
var F=[
["Patient",[
["id","Study ID *","text"],["date","Procedure date","date"],["age","Age (years)","num"],
["sex","Sex","sel",["","Female","Male"]],["bmi","BMI","num"],["sts","STS / EuroSCORE II (%)","num"],
["htn","Hypertension","sel",["","No","Yes"]],["dm","Diabetes","sel",["","No","Yes"]],
["ckd","CKD (eGFR<60)","sel",["","No","Yes"]],["cad","Significant CAD","sel",["","No","Yes"]]]],
["Echo",[
["mg","Mean gradient (mmHg)","num"],["ava","AVA (cm²)","num"],["dvi","DVI","num"],["lvef","LVEF (%)","num"],
["ar","Aortic regurgitation","sel",["","None","Mild","Mild-moderate","Moderate","Severe"]],
["bicus","Valve morphology","sel",["","Tricuspid","Bicuspid"]]]],
["CT: annulus and root",[
["aa","Annulus area (mm²)","num"],["ap","Annulus perimeter (mm)","num"],["amin","Annulus min Ø (mm)","num"],["amax","Annulus max Ø (mm)","num"],
["ecc","Eccentricity (auto)","auto"],["lvot","LVOT area (mm²)","num"],["sovl","SoV left (mm)","num"],["sovr","SoV right (mm)","num"],
["sovn","SoV non-coronary (mm)","num"],["stj","STJ Ø (mm)","num"],["asc","Ascending aorta Ø (mm)","num"],
["lch","Left coronary height (mm)","num"],["rch","Right coronary height (mm)","num"]]],
["CT: calcium (volume at 850 HU, mm³)",[
["cnc","Non-coronary cusp","num"],["crc","Right coronary cusp","num"],["clc","Left coronary cusp","num"],
["ctot","Total (auto if blank)","num"],["lvotca","LVOT calcium","sel",["","None","Mild","Moderate","Severe"]]]],
["CT: vascular access",[
["rimin","Right iliofemoral min Ø (mm)","num"],["limin","Left iliofemoral min Ø (mm)","num"],
["tort","Tortuosity","sel",["","None","Mild","Moderate","Severe"]],
["vca","Access calcification","sel",["","None","Mild","Moderate","Severe"]]]],
["Procedure",[
["vtype","Valve platform","sel",["","Balloon-expandable","Self-expanding","Mechanically expanded","Other"]],
["vmodel","Valve model","text"],["vsize","Valve size (mm)","num"],
["access","Access","sel",["","Transfemoral","Subclavian","Transcarotid","Transapical","Other"]],
["sheath","Sheath (Fr)","num"],["predil","Pre-dilatation","sel",["","No","Yes"]],
["postdil","Post-dilatation","sel",["","No","Yes"]],["depth","Implant depth (mm)","num"],
["fluoro","Fluoroscopy time (min)","num"],["contrast","Contrast (mL)","num"],
["anes","Anaesthesia","sel",["","Local/sedation","General"]]]],
["Outcomes (VARC-3)",[
["pvl","Paravalvular leak","sel",["","None/trace","Mild","Moderate","Severe"]],
["pm","New pacemaker","sel",["","No","Yes"]],["vasc","Major vascular complication","sel",["","No","Yes"]],
["bleed","Major bleeding","sel",["","No","Yes"]],["stroke","Stroke","sel",["","No","Yes"]],
["aki","AKI","sel",["","No","Yes"]],["pmg","Post-TAVI mean gradient (mmHg)","num"],
["ppm","Prosthesis-patient mismatch","sel",["","None","Moderate","Severe"]],
["d30","Death at 30 days","sel",["","No","Yes"]],["d1y","Death at 1 year","sel",["","No","Yes","Not reached"]],
["notes","Notes","text"]]]];
var K="tavi_records_v1",R=[],cur=null,flat=[];
function ld(){try{R=JSON.parse(localStorage.getItem(K)||"[]")}catch(e){R=[]}}
function sv(){try{localStorage.setItem(K,JSON.stringify(R))}catch(e){alert("Storage unavailable: export your CSV regularly.")}}
var $=function(i){return document.getElementById(i)};
function build(){var h="";F.forEach(function(s){h+="<section><h2>"+s[0]+"</h2><div class=g>";
s[1].forEach(function(f){flat.push(f);var k=f[0],inp;
if(f[2]=="sel")inp="<select id=f_"+k+">"+f[3].map(function(o){return"<option>"+o+"</option>"}).join("")+"</select>";
else if(f[2]=="num")inp="<input id=f_"+k+" type=number step=any inputmode=decimal>";
else if(f[2]=="auto")inp="<input id=f_"+k+" class=ro readonly>";
else inp="<input id=f_"+k+" type="+(f[2]=="date"?"date":"text")+">";
h+="<label>"+f[1]+inp+"</label>"});h+="</div></section>"});$("form").innerHTML=h;
["amin","amax"].forEach(function(k){$("f_"+k).oninput=calc})}
function calc(){var a=parseFloat($("f_amin").value),b=parseFloat($("f_amax").value);
$("f_ecc").value=(a>0&&b>0)?(1-a/b).toFixed(2):""}
function gather(){var o={};flat.forEach(function(f){o[f[0]]=$("f_"+f[0]).value});
if(!o.ctot){var t=["cnc","crc","clc"].reduce(function(s,k){return s+(parseFloat(o[k])||0)},0);if(t)o.ctot=String(t)}return o}
function fill(o){flat.forEach(function(f){$("f_"+f[0]).value=o?(o[f[0]]||""):""});calc()}
function show(v){$("vF").classList.toggle("hide",v!="F");$("vL").classList.toggle("hide",v!="L");
$("tF").className=v=="F"?"p":"";$("tL").className=v=="L"?"p":"";if(v=="L")rl()}
function rl(){$("n").textContent=R.length;
$("list").innerHTML=R.length?R.map(function(r,i){return"<div class=rec><div><b>"+esc(r.id||"(no ID)")+"</b><div class=mu>"+
esc([r.age?r.age+" y":"",r.sex,r.vtype,r.vsize?r.vsize+" mm":""].filter(Boolean).join(" · "))+"</div></div><div><button data-e="+i+">Edit</button> <button class=d data-x="+i+">✕</button></div></div>"}).join(""):"<span class=mu>No records yet.</span>"}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toCSV(){var ks=flat.map(function(f){return f[0]});
var q=function(v){v=v==null?"":String(v);return/[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
return[ks.join(",")].concat(R.map(function(r){return ks.map(function(k){return q(r[k])}).join(",")})).join("\n")}
$("save").onclick=function(){var o=gather();if(!o.id){alert("Study ID is required.");return}
if(cur!=null)R[cur]=o;else{var d=R.findIndex(function(r){return r.id==o.id});if(d>-1&&!confirm("ID exists. Overwrite?"))return;if(d>-1)R[d]=o;else R.push(o)}
sv();cur=null;fill(null);$("n").textContent=R.length;window.scrollTo(0,0);alert("Saved.")};
$("clr").onclick=function(){cur=null;fill(null)};
$("tF").onclick=function(){show("F")};$("tL").onclick=function(){show("L")};
$("list").onclick=function(e){var t=e.target;
if(t.dataset.e!=null){cur=+t.dataset.e;fill(R[cur]);show("F");window.scrollTo(0,0)}
if(t.dataset.x!=null&&confirm("Delete this record?")){R.splice(+t.dataset.x,1);sv();rl()}};
$("del").onclick=function(){if(confirm("Delete ALL records?")){R=[];sv();rl()}};
$("csv").onclick=function(){var c=toCSV();try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+c],{type:"text/csv"}));a.download="tavi_data.csv";a.click()}catch(e){}
$("out").value=c;$("out").classList.remove("hide")};
$("cp").onclick=function(){var c=toCSV();$("out").value=c;$("out").classList.remove("hide");$("out").select();
try{navigator.clipboard.writeText(c)}catch(e){document.execCommand("copy")}};
ld();build();rl();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script></body></html>
